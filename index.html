<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Divyesh Bambhaniya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .creator-tag {
            font-size: 0.95rem;
            color: #f43f5e;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: rgba(244, 63, 94, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }
        .scoreboard {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }
        .score-box {
            background: rgba(30, 41, 59, 0.8);
            padding: 8px 14px;
            border-radius: 8px;
            text-align: center;
            min-width: 85px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .score-box span {
            display: block;
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .score-box strong {
            font-size: 1.1rem;
            color: #f8fafc;
        }
        .game-container {
            position: relative;
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border: 2px solid #334155;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            grid-template-rows: repeat(4, 70px);
            gap: 8px;
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
        }
        .cell {
            background: #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #f8fafc;
        }
        /* Vibrant Tile Colors */
        .tile-2 { background: #3b82f6; color: #fff; }
        .tile-4 { background: #60a5fa; color: #fff; }
        .tile-8 { background: #f97316; color: #fff; }
        .tile-16 { background: #ea580c; color: #fff; }
        .tile-32 { background: #ef4444; color: #fff; }
        .tile-64 { background: #dc2626; color: #fff; }
        .tile-128 { background: #eab308; color: #fff; font-size: 1.1rem; }
        .tile-256 { background: #ca8a04; color: #fff; font-size: 1.1rem; }
        .tile-512 { background: #10b981; color: #fff; font-size: 1.1rem; }
        .tile-1024 { background: #059669; color: #fff; font-size: 0.95rem; }
        .tile-2048 { background: #8b5cf6; color: #fff; font-size: 0.95rem; }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>2048 GAME</h1>
        <div class="creator-tag">🎮 Developed by Divyesh Bambhaniya</div>
        
        <div class="scoreboard">
            <div class="score-box">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>
            <div class="score-box">
                <span>LEVEL</span>
                <strong id="level">1</strong>
            </div>
            <div class="score-box">
                <span>TIME</span>
                <strong id="timer">00:00</strong>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="grid" id="grid"></div>
    </div>

    <div class="controls">
        <button onclick="restartGame()">New Game</button>
    </div>

    <script>
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const timerEl = document.getElementById('timer');

        let board = Array(4).fill(0).map(() => Array(4).fill(0));
        let score = 0;
        let level = 1;
        let seconds = 0;
        let timerInterval = null;

        function initGame() {
            board = Array(4).fill(0).map(() => Array(4).fill(0));
            score = 0;
            level = 1;
            seconds = 0;
            updateScore();
            
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                timerEl.innerText = `${mins}:${secs}`;
            }, 1000);

            addNewTile();
            addNewTile();
            renderBoard();
        }

        function addNewTile() {
            let emptyCells = [];
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    if(board[r][c] === 0) emptyCells.push({r, c});
                }
            }
            if(emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function renderBoard() {
            gridEl.innerHTML = '';
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    let val = board[r][c];
                    if(val > 0) {
                        cell.innerText = val;
                        cell.classList.add(`tile-${val}`);
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        function slide(row) {
            let arr = row.filter(val => val);
            let missing = 4 - arr.length;
            let zeros = Array(missing).fill(0);
            return arr.concat(zeros);
        }

        function combine(row) {
            for(let i=0; i<3; i++) {
                if(row[i] !== 0 && row[i] === row[i+1]) {
                    row[i] *= 2;
                    score += row[i];
                    row[i+1] = 0;
                }
            }
            return row;
        }

        function operate(row) {
            row = slide(row);
            row = combine(row);
            row = slide(row);
            return row;
        }

        function rotateLeft(matrix) {
            let newMatrix = Array(4).fill(0).map(() => Array(4).fill(0));
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    newMatrix[3-c][r] = matrix[r][c];
                }
            }
            return newMatrix;
        }

        function move(direction) {
            let prevBoard = JSON.stringify(board);
            if(direction === 'ArrowLeft') {
                for(let i=0; i<4; i++) board[i] = operate(board[i]);
            } else if(direction === 'ArrowRight') {
                for(let i=0; i<4; i++) {
                    board[i].reverse();
                    board[i] = operate(board[i]);
                    board[i].reverse();
                }
            } else if(direction === 'ArrowUp') {
                for(let i=0; i<3; i++) board = rotateLeft(board);
                for(let i=0; i<4; i++) board[i] = operate(board[i]);
                for(let i=0; i<1; i++) board = rotateLeft(rotateLeft(rotateLeft(board)));
            } else if(direction === 'ArrowDown') {
                for(let i=0; i<1; i++) board = rotateLeft(board);
                for(let i=0; i<4; i++) board[i] = operate(board[i]);
                for(let i=0; i<3; i++) board = rotateLeft(rotateLeft(rotateLeft(board)));
            }

            if(prevBoard !== JSON.stringify(board)) {
                addNewTile();
                updateScore();
                renderBoard();
            }
        }

        function updateScore() {
            scoreEl.innerText = score;
            level = Math.min(100, Math.floor(score / 200) + 1);
            levelEl.innerText = level;
        }

        function restartGame() {
            initGame();
        }

        document.addEventListener('keydown', e => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                move(e.key);
            }
        });

        // Touch support for mobile swipe
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30) move('ArrowRight');
                else if (diffX < -30) move('ArrowLeft');
            } else {
                if (diffY > 30) move('ArrowDown');
                else if (diffY < -30) move('ArrowUp');
            }
        });

        initGame();
    </script>
</body>
</html>
