<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Divyesh Bambhaniya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .creator-tag {
            font-size: 1rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .scoreboard {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .score-box {
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            min-width: 100px;
            border: 1px solid #334155;
        }
        .score-box span {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .score-box strong {
            font-size: 1.2rem;
            color: #f8fafc;
        }
        .game-container {
            position: relative;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #334155;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }
        .cell {
            background: #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #f8fafc;
            transition: all 0.1s ease-in-out;
        }
        /* Tile Colors */
        .tile-2 { background: #3b82f6; }
        .tile-4 { background: #60a5fa; }
        .tile-8 { background: #f97316; }
        .tile-16 { background: #ea580c; }
        .tile-32 { background: #ef4444; }
        .tile-64 { background: #dc2626; }
        .tile-128 { background: #eab308; font-size: 1.3rem; }
        .tile-256 { background: #ca8a04; font-size: 1.3rem; }
        .tile-512 { background: #10b981; font-size: 1.3rem; }
        .tile-1024 { background: #059669; font-size: 1.1rem; }
        .tile-2048 { background: #8b5cf6; font-size: 1.1rem; }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>2048 Game</h1>
        <div class="creator-tag">Created by Divyesh Bambhaniya</div>
        
        <div class="scoreboard">
            <div class="score-box">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>
            <div class="score-box">
                <span>LEVEL</span>
                <strong id="level">1</strong>
            </div>
            <div class="score-box">
                <span>TIME</span>
                <strong id="timer">00:00</strong>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- 16 Cells will be generated via JS -->
        </div>
    </div>

    <div class="controls">
        <button onclick="restartGame()">Restart Game</button>
    </div>

    <script>
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const timerEl = document.getElementById('timer');

        let board = Array(16).fill(0);
        let score = 0;
        let level = 1;
        let seconds = 0;
        let timerInterval = null;

        function initGame() {
            board = Array(16).fill(0);
            score = 0;
            level = 1;
            seconds = 0;
            updateScore();
            updateLevel();
            
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                timerEl.innerText = `${mins}:${secs}`;
            }, 1000);

            addNewTile();
            addNewTile();
            renderBoard();
        }

        function addNewTile() {
            let emptyCells = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
            if (emptyCells.length > 0) {
                let randomIdx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomIdx] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function renderBoard() {
            gridEl.innerHTML = '';
            board.forEach(value => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (value > 0) {
                    cell.innerText = value;
                    cell.classList.add(`tile-${value}`);
                }
                gridEl.appendChild(cell);
            });
        }

        function updateScore() {
            scoreEl.innerText = score;
            // Level 1 thi 100 sudhi score na adhare progress thase
            level = Math.min(100, Math.floor(score / 200) + 1);
            updateLevel();
        }

        function updateLevel() {
            levelEl.innerText = level;
        }

        function restartGame() {
            initGame();
        }

        // Basic Keyboard controls support
        document.addEventListener('keydown', e => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                // Simple generic movement simulation for demonstration
                addNewTile();
                score += 10;
                updateScore();
                renderBoard();
            }
        });

        // Initial start
        initGame();
    </script>
</body>
</html>
